{% extends "base.html" %}
{% block main %}
<section class="section notfound">
  <div>
    <p class="kicker">404</p>
    <h1>{{ t.notfound_title }}</h1>
    <p>{{ t.notfound_text }}<br><span lang="en">The page you are looking for does not exist or has been moved.</span></p>
    <a class="btn btn-navy" href="/">{{ t.notfound_cta }} →</a>
  </div>
</section>
{% endblock %}
